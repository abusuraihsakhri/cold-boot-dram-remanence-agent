[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cold-boot-dram-remanence-engine"
version = "2.0.0"
description = "Cold-Boot Attack DRAM Remanence & Key Recovery Defense Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cold-boot-dram-remanence-engine = "cold_boot_defense.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/cold-boot-dram-remanence-engine"
Repository = "https://github.com/abusuraihsakhri/cold-boot-dram-remanence-engine.git"
