name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Installed CLI smoke test
        run: |
          cd "$(mktemp -d)"
          cold-boot-remanence --temp 25 --time 0 --json > result.json
          python -c "import json; d=json.load(open('result.json')); assert d['thermal_profile']['expected_bit_error_rate'] == 0.0"
      - name: Static JavaScript syntax check
        run: node --check app.js
